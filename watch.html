<style>
:root{
  --green:#1e7a3c;
  --orange:#ff7a00;
  --silver:#c8d0d8;
  --bg:#0a120d;
  --card:#101d14;
  --card2:#16281b;
  --text:#e8f0ea;
  --muted:#93a89a;
  --discord:#5865F2;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* ===== Header ===== */
.site-header{background:rgba(10,18,13,.95);border-bottom:2px solid var(--green);padding:14px 20px;text-align:center}
.logo{font-size:22px;font-weight:800;color:var(--text);text-decoration:none;letter-spacing:.5px}
.logo span{color:var(--orange)}

/* ===== Watch Area ===== */
.watch-area{flex:1;max-width:860px;width:100%;margin:0 auto;padding:24px 16px 40px}

/* Match Info */
.match-info{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid #1f3a28;border-radius:14px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.match-teams{display:flex;align-items:center;gap:18px;flex:1;justify-content:center}
.match-team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px}
.match-team img{width:46px;height:46px;object-fit:contain}
.match-team span{font-size:14px;font-weight:700;text-align:center}
.match-vs{font-size:18px;font-weight:800;color:var(--silver)}
.time-badge{background:var(--orange);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}

/* Player — normal chota size */
.player-box{position:relative;width:100%;max-width:800px;margin:0 auto;aspect-ratio:16/9;background:#000;border:2px solid var(--green);border-radius:12px;overflow:hidden}
.player-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player-msg p{color:var(--muted);font-size:14px}
.player-msg a{color:var(--orange);font-weight:600;text-decoration:none}

/* Banner Ad — player ke niche */
.ad-banner{display:flex;justify-content:center;align-items:center;max-width:800px;margin:18px auto 0;min-height:90px;overflow:hidden}

/* Below Player */
.below-player{max-width:800px;margin:18px auto 0;display:flex;flex-direction:column;align-items:center;gap:16px}

/* Discord Button — bada, full text */
.discord-btn{display:inline-flex;align-items:center;gap:14px;background:var(--discord);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:12px;transition:filter .2s, transform .2s;text-align:left;box-shadow:0 4px 18px rgba(88,101,242,.35)}
.discord-btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.discord-text{display:flex;flex-direction:column;line-height:1.35}
.discord-text strong{font-size:16px;font-weight:700}
.discord-text small{font-weight:400;font-size:12.5px;opacity:.88}

.back-link{color:var(--muted);font-size:14px;font-weight:600;text-decoration:none;transition:color .2s}
.back-link:hover{color:var(--orange)}

/* ===== Sticky Side Ads ===== */
.side-ad{position:fixed;top:50%;transform:translateY(-50%);width:160px;height:600px;z-index:900}
.side-ad-left{left:8px}
.side-ad-right{right:8px}
@media(max-width:1300px){.side-ad{display:none}}

/* ===== Footer ===== */
.site-footer{border-top:2px solid var(--green);padding:16px 20px;text-align:center;background:var(--card)}
.site-footer .logo{font-size:18px}
.copyright{color:var(--muted);font-size:12px;margin-top:6px}

@media(max-width:600px){
  .match-team span{font-size:12px}
  .match-team img{width:38px;height:38px}
  .match-team{min-width:80px}
  .discord-btn{padding:12px 18px;gap:10px}
  .discord-text strong{font-size:14px}
  .discord-text small{font-size:11px}
}
</style>
</head>

<!-- ===== Watch Page JavaScript ===== -->
<script>
(function () {
  var API_URL = 'https://ovogoal.pages.dev/api/v2/flyembed2.json';
  var PLACEHOLDER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316281b'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23ff7a00' font-family='Arial' font-weight='bold'%3E?%3C/text%3E%3C/svg%3E";

  var ID_KEYS = ['MatchID','matchId','match_id','id','ID','EventID','event_id'];
  var EMBED_KEYS = ['iframeurl','iframeUrl','iframe_url','IframeUrl','IframeURL','EmbedUrl','embedUrl','embed_url','Embed','embed','Url','url','URL','Link','link','StreamUrl','stream_url','streamUrl','Channel','channel','IframeSrc','iframe_src','Src','src','Source','source','WatchUrl','watch_url','PageUrl','page_url'];
  var ARRAY_KEYS = ['Channels','channels','Sources','sources','Links','links','Streams','streams','Embeds','embeds'];

  var params = new URLSearchParams(window.location.search);
  var matchId = params.get('id');

  var frame = document.getElementById('playerFrame');
  var msg = document.getElementById('playerMsg');
  var info = document.getElementById('matchInfo');

  function getField(obj, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = obj[keys[i]];
      if (v !== undefined && v !== null && String(v).trim() !== '') return v;
    }
    return '';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function showError(html) {
    msg.innerHTML = html;
  }

  function getEmbedUrl(m) {
    var direct = getField(m, EMBED_KEYS);
    if (direct) return direct;
    for (var i = 0; i < ARRAY_KEYS.length; i++) {
      var arr = m[ARRAY_KEYS[i]];
      if (Array.isArray(arr) && arr.length) {
        var item = arr[0];
        if (typeof item === 'string') return item;
        if (item && typeof item === 'object') {
          var u = getField(item, ['iframeurl','iframeUrl','iframe_url','Url','url','EmbedUrl','embedUrl','embed_url','Link','link','Src','src','Channel','channel']);
          if (u) return u;
        }
      }
    }
    return '';
  }

  function findMatch(list) {
    for (var i = 0; i < list.length; i++) {
      var mid = String(getField(list[i], ID_KEYS)).trim();
      if (mid && mid === String(matchId).trim()) return list[i];
    }
    return null;
  }

  function renderInfo(m) {
    var team1 = getField(m, ['Team1','team1','HomeTeam','home_team','home']) || 'Team 1';
    var team2 = getField(m, ['Team2','team2','AwayTeam','away_team','away']) || 'Team 2';
    var logo1 = getField(m, ['Team1Logo','team1Logo','Logo1','logo1','HomeLogo','home_logo','team1_logo']);
    var logo2 = getField(m, ['Team2Logo','team2Logo','Logo2','logo2','AwayLogo','away_logo','team2_logo']);
    var time = getField(m, ['Time','time','MatchTime','matchTime','StartTime','start_time','Date','date']);

    document.getElementById('logo1').src = logo1 || PLACEHOLDER;
    document.getElementById('logo2').src = logo2 || PLACEHOLDER;
    document.getElementById('name1').textContent = team1;
    document.getElementById('name2').textContent = team2;
    document.getElementById('timeBadge').textContent = time || 'Live';
    info.style.display = 'flex';

    document.title = team1 + ' vs ' + team2 + ' – Watch Live';

    var imgs = info.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++) {
      imgs[i].addEventListener('error', function () { this.onerror = null; this.src = PLACEHOLDER; });
    }
  }

  function play(m) {
    renderInfo(m);
    var url = getEmbedUrl(m);
    if (!url) {
      showError('<p>The stream link for this match is not available right now.</p><p><a href="/">&#8592; Back to Live Matches</a></p>');
      return;
    }
    frame.src = url;
    frame.style.display = 'block';
    frame.addEventListener('load', function () { msg.style.display = 'none'; });
  }

  if (!matchId) {
    showError('<p>No match selected.</p><p><a href="/">&#8592; Back to Live Matches</a></p>');
    return;
  }

  fetch(API_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      var list = Array.isArray(data) ? data : (data.matches || data.data || data.results || data.events || []);
      if (!Array.isArray(list)) throw new Error('Bad format');

      var nfl = list.filter(function (m) {
        return String(getField(m, ['League','league'])).trim().toUpperCase() === 'NFL';
      });
      if (!nfl.length) {
        nfl = list.filter(function (m) {
          var lg = String(getField(m, ['League','league'])).toUpperCase();
          return lg.indexOf('NFL') !== -1 && lg.indexOf('NCAA') === -1;
        });
      }

      var match = findMatch(nfl) || findMatch(list);
      if (!match) {
        showError('<p>This match is no longer available on the board.</p><p><a href="/">&#8592; Back to Live Matches</a></p>');
        return;
      }
      play(match);
    })
    .catch(function () {
      showError('<p>We could not load the stream right now. Please refresh the page or try again in a moment.</p><p><a href="/">&#8592; Back to Live Matches</a></p>');
    });
})();
</script>
